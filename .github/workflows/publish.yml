name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for OIDC authentication and provenance
      contents: read
      id-token: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Notice: registry-url is intentionally omitted so 
          # setup-node does not generate an .npmrc file that 
          # expects a NODE_AUTH_TOKEN.

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance
